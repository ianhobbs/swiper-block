name: Swiper Block
icon: swiper-block

tabs:

  # ── Tab 1: Slides ────────────────────────────────────────────────────────────
  slides:
    label: Slides
    icon: image
    fields:

      slides:
        label: Slides
        type: structure
        min: 1
        max: 20
        add: Add slide
        sortable: true
        columns:
          image:
            width: 1/4
          heading:
            width: 3/4
        fields:

          image:
            label: Image
            type: files
            max: 1
            uploads:
              parent: site
              template: swiper-image
            help: Recommended minimum 1920 × 810 px. JPG or WebP.

          heading:
            label: Caption Heading
            type: text
            width: 1/1

          subtext:
            label: Subtext / Caption
            type: textarea
            size: small
            buttons: false
            width: 1/1

          link:
            label: CTA Link
            type: url
            width: 1/2

          link_text:
            label: CTA Label
            type: text
            placeholder: Learn more
            width: 1/2

          content_position:
            label: Caption Position
            type: select
            default: center
            options:
              - value: left
                text: Left
              - value: center
                text: Centre
              - value: right
                text: Right
            width: 1/3

          content_position_y:
            label: Vertical Position
            type: select
            default: middle
            options:
              - value: top
                text: Top
              - value: middle
                text: Middle
              - value: bottom
                text: Bottom
            help: Applies when Fixed Height is set — the caption then overlays the image.
            width: 1/3

          caption_color:
            label: Caption Colour
            type: color
            alpha: true
            help: Heading, subtext and CTA colour for this slide. Empty inherits the page.
            width: 1/3


  # ── Tab 2: Layout ────────────────────────────────────────────────────────────
  layout:
    label: Layout
    icon: box
    fields:

      slider_height:
        label: Fixed Height
        type: number
        default: 0
        min: 0
        max: 2000
        step: 10
        help: >
          Explicit height for the block container. 0 = auto (each slide follows
          its image's native ratio). Set this for text-only slides or fixed-height
          heroes — it overrides the native ratio and stops empty slides collapsing.
        width: 1/3

      slider_height_unit:
        label: Height Unit
        type: select
        default: px
        options:
          - value: px
            text: Pixels (px)
          - value: vh
            text: Viewport height (vh)
          - value: svh
            text: Small viewport (svh)
        help: Unit for Fixed Height. Ignored when Fixed Height is 0.
        width: 1/3

      # Only absolute (px) heights need a mobile override — vh/svh already scale
      # with the viewport. Kirby's `when:` matches values, not emptiness, so it
      # can gate on the unit but not on "Fixed Height is non-zero": this toggle
      # is the editor's explicit trigger, and the model ignores the mobile value
      # unless a Fixed Height is actually set.
      mobile_height_enable:
        label: Separate Mobile Height
        type: toggle
        default: false
        text:
          - "Off"
          - "On"
        when:
          slider_height_unit: px
        help: >
          Use a different height on small screens. Only applies when Fixed Height
          is set above — a fixed pixel height sized for a desktop hero is usually
          far too tall on a phone.
        width: 1/3

      mobile_height:
        label: Mobile Fixed Height
        type: number
        default: 0
        min: 0
        max: 2000
        step: 10
        when:
          slider_height_unit: px
          mobile_height_enable: true
        help: >
          Height in pixels below 768px viewport width. 0 falls back to the desktop
          Fixed Height.
        width: 1/3

      column_width:
        label: Column Width
        type: select
        default: auto
        options:
          - value: auto
            text: Auto — detect from the layout column
          - value: "12"
            text: Full row (1/1)
          - value: "9"
            text: Three quarters (9/12)
          - value: "8"
            text: Two thirds (8/12)
          - value: "6"
            text: Half (1/2)
          - value: "4"
            text: One third (1/3)
          - value: "3"
            text: One quarter (1/4)
          - value: "2"
            text: One sixth (1/6)
        help: >
          How much of the layout row the block fills. Only affects the responsive
          `sizes` hint — how big an image the browser downloads — not the rendered
          width, which always follows the column. Set it if the block sits inside
          a wrapper narrower than its column.
        width: 1/3

      direction:
        label: Slide Direction
        type: select
        default: horizontal
        options:
          - value: horizontal
            text: Horizontal
          - value: vertical
            text: Vertical
        width: 1/3


      slides_per_view:
        label: Slides Visible
        type: select
        default: "1"
        options:
          - value: "1"
            text: "1"
          - value: "2"
            text: "2"
          - value: "3"
            text: "3"
          - value: "4"
            text: "4"
          - value: auto
            text: Auto (by width)
        help: Fade and Creative effects require 1.
        width: 1/3

      slides_per_group:
        label: Advance Per Click
        type: number
        default: 1
        min: 1
        max: 4
        help: How many slides to jump per navigation action.
        width: 1/3

      space_between:
        label: Gap Between Slides (px)
        type: number
        default: 0
        min: 0
        max: 80
        step: 4
        width: 1/3

      centered_slides:
        label: Centre Active Slide
        type: toggle
        default: false
        text:
          - "Off"
          - "On"
        width: 1/3

      initial_slide:
        label: Starting Slide
        type: number
        default: 0
        min: 0
        help: Zero-based index — 0 is the first slide.
        width: 1/3

      typography_line:
        type: line

      typography_headline:
        type: headline
        label: Caption Typography

      caption_font:
        label: Caption Font
        type: select
        default: font-sans
        options:
          - { value: font-sans,  text: "Sans (default)" }
          - { value: font-body,  text: "Body" }
          - { value: font-serif, text: "Serif" }
          - { value: font-mono,  text: "Mono" }
        help: >
          Applies to the whole caption — heading, subtext and CTA. Emitted as the
          Tailwind class of the same name, so a Tailwind site resolves it from its
          own theme. Sites without Tailwind can point each one at their own face
          by setting --swiper-block-font-sans / -body / -serif / -mono in CSS.
        width: 1/3

      heading_size:
        label: Heading Size
        type: select
        default: text-sm
        options:
          - { value: text-xs,   text: "XS" }
          - { value: text-sm,   text: "S (default)" }
          - { value: text-base, text: "Base" }
          - { value: text-lg,   text: "L" }
        help: >
          Emitted as the Tailwind class of the same name. Tailwind styles it if the
          site uses Tailwind; otherwise the plugin's own fallback matches the scale.
        width: 1/3

      subtext_size:
        label: Subtext Size
        type: select
        default: text-lg
        options:
          - { value: text-sm,   text: "S" }
          - { value: text-base, text: "Base" }
          - { value: text-lg,   text: "L (default)" }
          - { value: text-xl,   text: "XL" }
          - { value: text-2xl,  text: "2XL" }
          - { value: text-3xl,  text: "3XL" }
        width: 1/3


  # ── Tab 3: Animation ─────────────────────────────────────────────────────────
  animation:
    label: Animation
    icon: loader
    fields:

      effect:
        label: Transition Effect
        type: select
        default: slide
        options:
          - value: slide
            text: Slide
          - value: fade
            text: Fade
          - value: creative
            text: Creative (zoom)
          - value: coverflow
            text: Coverflow
        width: 1/3

      speed:
        label: Transition Speed (ms)
        type: number
        default: 600
        min: 100
        max: 3000
        step: 50
        width: 1/3

      easing:
        label: Easing
        type: select
        default: smooth
        options:
          - { value: smooth, text: "Smooth (default)" }
          - { value: gentle, text: "Gentle" }
          - { value: ease,   text: "Swiper default" }
          - { value: linear, text: "Linear" }
        help: >
          Shape of the slide transition. Swiper has no JavaScript easing option —
          this sets the CSS timing function on the slide wrapper. Smooth
          decelerates into place; Swiper's own default stops more abruptly.
        width: 1/3

      loop:
        label: Loop
        type: toggle
        default: true
        text:
          - "Off"
          - "On"
        width: 1/3

      autoplay:
        label: Autoplay
        type: toggle
        default: false
        text:
          - "Off"
          - "On"
        width: 1/3

      autoplay_delay:
        label: Autoplay Delay (ms)
        type: number
        default: 4000
        min: 1000
        max: 15000
        step: 500
        when:
          autoplay: true
        width: 1/3

      autoplay_pause_on_hover:
        label: Pause on Hover
        type: toggle
        default: true
        text:
          - "Off"
          - "On"
        when:
          autoplay: true
        width: 1/3

      free_mode:
        label: Free Mode
        type: toggle
        default: false
        text:
          - "Off"
          - "On"
        help: Slides move freely without snapping to positions.
        width: 1/3

      free_mode_momentum:
        label: Free Mode Momentum
        type: toggle
        default: true
        text:
          - "Off"
          - "On"
        when:
          free_mode: true
        width: 1/3


  # ── Tab 4: Controls ──────────────────────────────────────────────────────────
  controls:
    label: Controls
    icon: panel
    fields:

      show_navigation:
        label: Arrow Buttons
        type: toggle
        default: true
        text:
          - Hidden
          - Visible
        width: 1/3

      show_pagination:
        label: Pagination
        type: toggle
        default: true
        text:
          - Hidden
          - Visible
        width: 1/3

      pagination_type:
        label: Pagination Style
        type: select
        default: bullets
        options:
          - value: bullets
            text: Bullets
          - value: fraction
            text: Fraction (2 / 5)
          - value: progressbar
            text: Progress Bar
        when:
          show_pagination: true
        width: 1/3

      dynamic_bullets:
        label: Dynamic Bullets
        type: toggle
        default: true
        text:
          - "Off"
          - "On"
        help: Active bullet enlarges relative to its neighbours.
        when:
          show_pagination: true
        width: 1/3

      keyboard_control:
        label: Keyboard Navigation
        type: toggle
        default: true
        text:
          - "Off"
          - "On"
        help: Arrow keys navigate slides when the block is in the viewport.
        width: 1/3

      mousewheel:
        label: Mousewheel Control
        type: toggle
        default: false
        text:
          - "Off"
          - "On"
        width: 1/3


  # ── Tab 5: Touch & Input ─────────────────────────────────────────────────────
  touch:
    label: Touch & Input
    icon: url
    fields:

      grab_cursor:
        label: Grab Cursor
        type: toggle
        default: true
        text:
          - "Off"
          - "On"
        help: Shows a hand cursor when dragging on desktop.
        width: 1/3

      simulate_touch:
        label: Touch on Desktop
        type: toggle
        default: true
        text:
          - "Off"
          - "On"
        help: Allows mouse drag to simulate touch events on desktop.
        width: 1/3

      threshold:
        label: Swipe Threshold (px)
        type: number
        default: 5
        min: 0
        max: 50
        step: 1
        help: Minimum drag distance before a swipe is registered.
        width: 1/3

      long_swipes:
        label: Long Swipes
        type: toggle
        default: true
        text:
          - "Off"
          - "On"
        help: Allow long swipes to advance slides.
        width: 1/3

      resistance:
        label: Edge Resistance
        type: toggle
        default: true
        text:
          - "Off"
          - "On"
        help: Adds drag resistance when swiping past the first or last slide.
        width: 1/3
