name: Swiper Slider
icon: swiper-block

tabs:

  # ── Tab 1: Slides ────────────────────────────────────────────────────────────
  slides:
    label: Slides
    icon: image
    fields:

      slides:
        label: Slides
        type: structure
        min: 1
        max: 20
        add: Add slide
        sortable: true
        columns:
          image:
            width: 1/4
          heading:
            width: 3/4
        fields:

          image:
            label: Image
            type: files
            max: 1
            uploads:
              parent: site
              template: swiper-image
            help: Recommended minimum 1920 × 810 px. JPG or WebP.

          heading:
            label: Heading
            type: text
            width: 1/1

          subtext:
            label: Subtext / Caption
            type: textarea
            size: small
            buttons: false
            width: 1/1

          link:
            label: CTA Link
            type: url
            width: 1/2

          link_text:
            label: CTA Label
            type: text
            placeholder: Learn more
            width: 1/2

          overlay_opacity:
            label: Image Overlay Opacity
            type: range
            min: 0
            max: 90
            step: 5
            default: 30
            after: "%"
            width: 1/2

          content_position:
            label: Content Position
            type: select
            default: center
            options:
              - value: left
                text: Left
              - value: center
                text: Centre
              - value: right
                text: Right
            width: 1/2


  # ── Tab 2: Layout ────────────────────────────────────────────────────────────
  layout:
    label: Layout
    icon: box
    fields:

      aspect_ratio:
        label: Aspect Ratio
        type: select
        default: "16:9"
        options:
          - value: "21:9"
            text: "21 : 9  (cinematic)"
          - value: "16:9"
            text: "16 : 9  (widescreen)"
          - value: "4:3"
            text: "4 : 3"
          - value: "1:1"
            text: "1 : 1  (square)"
          - value: custom
            text: Custom height
        width: 1/3

      custom_height:
        label: Custom Height (px)
        type: number
        default: 600
        min: 200
        max: 1200
        step: 10
        when:
          aspect_ratio: custom
        width: 1/3

      direction:
        label: Slide Direction
        type: select
        default: horizontal
        options:
          - value: horizontal
            text: Horizontal
          - value: vertical
            text: Vertical
        width: 1/3

      orientation:
        label: Orientation
        type: select
        default: horizontal
        options:
          - value: horizontal
            text: Horizontal (landscape 16:9)
          - value: vertical
            text: Vertical (portrait 9:16)
        help: Image crop set. Horizontal uses the swiper-horiz srcset, Vertical uses swiper-vert.
        width: 1/3

      slides_per_view:
        label: Slides Visible
        type: select
        default: "1"
        options:
          - value: "1"
            text: "1"
          - value: "2"
            text: "2"
          - value: "3"
            text: "3"
          - value: "4"
            text: "4"
          - value: auto
            text: Auto (by width)
        help: Fade and Creative effects require 1.
        width: 1/3

      slides_per_group:
        label: Advance Per Click
        type: number
        default: 1
        min: 1
        max: 4
        help: How many slides to jump per navigation action.
        width: 1/3

      space_between:
        label: Gap Between Slides (px)
        type: number
        default: 0
        min: 0
        max: 80
        step: 4
        width: 1/3

      centered_slides:
        label: Centre Active Slide
        type: toggle
        default: false
        text:
          - "Off"
          - "On"
        width: 1/3

      initial_slide:
        label: Starting Slide
        type: number
        default: 0
        min: 0
        help: Zero-based index — 0 is the first slide.
        width: 1/3


  # ── Tab 3: Animation ─────────────────────────────────────────────────────────
  animation:
    label: Animation
    icon: loader
    fields:

      effect:
        label: Transition Effect
        type: select
        default: slide
        options:
          - value: slide
            text: Slide
          - value: fade
            text: Fade
          - value: creative
            text: Creative (zoom)
          - value: coverflow
            text: Coverflow
        width: 1/3

      speed:
        label: Transition Speed (ms)
        type: number
        default: 600
        min: 100
        max: 3000
        step: 50
        width: 1/3

      loop:
        label: Loop
        type: toggle
        default: true
        text:
          - "Off"
          - "On"
        width: 1/3

      autoplay:
        label: Autoplay
        type: toggle
        default: false
        text:
          - "Off"
          - "On"
        width: 1/3

      autoplay_delay:
        label: Autoplay Delay (ms)
        type: number
        default: 4000
        min: 1000
        max: 15000
        step: 500
        when:
          autoplay: true
        width: 1/3

      autoplay_pause_on_hover:
        label: Pause on Hover
        type: toggle
        default: true
        text:
          - "Off"
          - "On"
        when:
          autoplay: true
        width: 1/3

      free_mode:
        label: Free Mode
        type: toggle
        default: false
        text:
          - "Off"
          - "On"
        help: Slides move freely without snapping to positions.
        width: 1/3

      free_mode_momentum:
        label: Free Mode Momentum
        type: toggle
        default: true
        text:
          - "Off"
          - "On"
        when:
          free_mode: true
        width: 1/3


  # ── Tab 4: Controls ──────────────────────────────────────────────────────────
  controls:
    label: Controls
    icon: panel
    fields:

      show_navigation:
        label: Arrow Buttons
        type: toggle
        default: true
        text:
          - Hidden
          - Visible
        width: 1/3

      show_pagination:
        label: Pagination
        type: toggle
        default: true
        text:
          - Hidden
          - Visible
        width: 1/3

      pagination_type:
        label: Pagination Style
        type: select
        default: bullets
        options:
          - value: bullets
            text: Bullets
          - value: fraction
            text: Fraction (2 / 5)
          - value: progressbar
            text: Progress Bar
        when:
          show_pagination: true
        width: 1/3

      dynamic_bullets:
        label: Dynamic Bullets
        type: toggle
        default: true
        text:
          - "Off"
          - "On"
        help: Active bullet enlarges relative to its neighbours.
        when:
          show_pagination: true
        width: 1/3

      keyboard_control:
        label: Keyboard Navigation
        type: toggle
        default: true
        text:
          - "Off"
          - "On"
        help: Arrow keys navigate slides when the slider is in the viewport.
        width: 1/3

      mousewheel:
        label: Mousewheel Control
        type: toggle
        default: false
        text:
          - "Off"
          - "On"
        width: 1/3


  # ── Tab 5: Touch & Input ─────────────────────────────────────────────────────
  touch:
    label: Touch & Input
    icon: url
    fields:

      grab_cursor:
        label: Grab Cursor
        type: toggle
        default: true
        text:
          - "Off"
          - "On"
        help: Shows a hand cursor when dragging on desktop.
        width: 1/3

      simulate_touch:
        label: Touch on Desktop
        type: toggle
        default: true
        text:
          - "Off"
          - "On"
        help: Allows mouse drag to simulate touch events on desktop.
        width: 1/3

      threshold:
        label: Swipe Threshold (px)
        type: number
        default: 5
        min: 0
        max: 50
        step: 1
        help: Minimum drag distance before a swipe is registered.
        width: 1/3

      long_swipes:
        label: Long Swipes
        type: toggle
        default: true
        text:
          - "Off"
          - "On"
        help: Allow long swipes to advance the slider.
        width: 1/3

      resistance:
        label: Edge Resistance
        type: toggle
        default: true
        text:
          - "Off"
          - "On"
        help: Adds drag resistance when swiping past the first or last slide.
        width: 1/3
