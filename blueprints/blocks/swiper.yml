name: Swiper Slider
icon: image

# ── Slide collection ───────────────────────────────────────────────────────────
fields:

  slides:
    label: Slides
    type: structure
    min: 1
    max: 20
    add: Add slide
    sortable: true
    columns:
      image:
        width: 1/4
      heading:
        width: 3/4
    fields:
      image:
        label: Image
        type: files
        max: 1
        uploads:
          parent: site
          template: swiper-image
        help: Recommended minimum 1920 × 810 px. JPG or WebP.

      heading:
        label: Heading
        type: text
        width: 1/1

      subtext:
        label: Subtext / Caption
        type: textarea
        size: small
        buttons: false
        width: 1/1

      link:
        label: CTA Link
        type: url
        width: 1/2

      link_text:
        label: CTA Label
        type: text
        placeholder: Learn more
        width: 1/2

      overlay_opacity:
        label: Image Overlay Opacity
        type: range
        min: 0
        max: 90
        step: 5
        default: 30
        after: "%"
        width: 1/2

      content_position:
        label: Content Position
        type: select
        default: center
        options:
          - value: left
            text: Left
          - value: center
            text: Centre
          - value: right
            text: Right
        width: 1/2

  # ── Global slider options ──────────────────────────────────────────────────

  effect:
    label: Transition Effect
    type: select
    default: slide
    options:
      - value: slide
        text: Slide
      - value: fade
        text: Fade
      - value: creative
        text: Creative (zoom)
    width: 1/3

  speed:
    label: Transition Speed (ms)
    type: number
    default: 600
    min: 100
    max: 3000
    step: 50
    width: 1/3

  autoplay:
    label: Autoplay
    type: toggle
    default: false
    text:
      - "Off"
      - "On"
    width: 1/3

  autoplay_delay:
    label: Autoplay Delay (ms)
    type: number
    default: 4000
    min: 1000
    max: 15000
    step: 500
    when:
      autoplay: true
    width: 1/3

  loop:
    label: Loop
    type: toggle
    default: true
    text:
      - "Off"
      - "On"
    width: 1/3

  show_navigation:
    label: Arrows
    type: toggle
    default: true
    text:
      - Hidden
      - Visible
    width: 1/3

  show_pagination:
    label: Pagination dots
    type: toggle
    default: true
    text:
      - Hidden
      - Visible
    width: 1/3

  aspect_ratio:
    label: Aspect Ratio
    type: select
    default: "16:9"
    options:
      - value: "21:9"
        text: "21 : 9  (cinematic)"
      - value: "16:9"
        text: "16 : 9  (widescreen)"
      - value: "4:3"
        text: "4 : 3"
      - value: "1:1"
        text: "1 : 1  (square)"
      - value: custom
        text: Custom height
    width: 1/3

  custom_height:
    label: Custom Height (px)
    type: number
    default: 600
    min: 200
    max: 1200
    step: 10
    when:
      aspect_ratio: custom
    width: 1/3
